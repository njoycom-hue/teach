name: Build Android APK

# 수동 실행 전용. Actions 탭 > Build Android APK > Run workflow 에서
# "빌드 방식"을 server(Expo 클라우드) / local(이 러너에서 직접) 중 선택한다.
#
# 사전 준비: Expo 계정에서 Access Token을 발급받아
# 저장소 Settings > Secrets and variables > Actions 에 EXPO_TOKEN 이름으로 등록해야 한다.
# (expo.dev 로그인 > 계정 설정 > Access Tokens > Create token)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "빌드 방식"
        required: true
        default: server
        type: choice
        options:
          - server
          - local

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # GitHub Release 생성/삭제에 필요

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: Java 설정 (local 빌드용)
        if: ${{ inputs.build_mode == 'local' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 설정 (local 빌드용)
        if: ${{ inputs.build_mode == 'local' }}
        uses: android-actions/setup-android@v3

      - name: EAS CLI 설정 + Expo 로그인
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 빌드 - server (Expo 클라우드 빌드 서버)
        if: ${{ inputs.build_mode == 'server' }}
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > build-output.json
          echo "----- eas build 응답 -----"
          cat build-output.json
          url=$(jq -r '.[0].artifacts.buildUrl' build-output.json)
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "빌드 아티팩트 URL을 찾지 못했습니다. 위 로그를 확인하세요."
            exit 1
          fi
          curl -L -o app-release.apk "$url"

      - name: 빌드 - local (이 러너에서 직접 빌드)
        if: ${{ inputs.build_mode == 'local' }}
        run: |
          eas build --platform android --profile preview --local --non-interactive --output app-release.apk

      - name: 이전 릴리즈 삭제 (최신 1개만 유지)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            echo "삭제: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: GitHub Release에 APK 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "latest" app-release.apk \
            --title "과외학생관리 APK ($(date -u +'%Y-%m-%d %H:%M UTC'))" \
            --notes "빌드 방식: ${{ inputs.build_mode }} · 커밋: ${{ github.sha }}"
